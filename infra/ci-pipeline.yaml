AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Entrega 3 DevOps (CI + CD): GitHub (master) -> CodePipeline V2 -> CodeBuild (pytest + imagen a ECR)
  -> CodeDeploy (blue/green en ECS Fargate). Evoluciona el pipeline de la Entrega 2 (que no tenia Deploy).
  Requiere base-stack.yaml y fargate-stack.yaml ya creados (deploy-ci.sh pasa sus outputs).

Parameters:
  GitHubOwner:
    Type: String
    Default: hhiguita
    Description: Usuario u organizacion de GitHub duenio del repo.
  GitHubRepo:
    Type: String
    Default: blacklist-service-entrega-2
  BranchName:
    Type: String
    Default: master
    Description: Rama cuyos push disparan el pipeline.
  ProjectName:
    Type: String
    Default: blacklist-service-ci
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9_-]{1,100}$"
  PipelineName:
    Type: String
    Default: blacklist-service-pipeline
  ExistingConnectionArn:
    Type: String
    Default: ""
    Description: >-
      ARN de una conexion GitHub ya autorizada (Developer Tools > Settings > Connections).
      Vacio = el stack crea una conexion nueva en estado PENDING que debes autorizar en la consola.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30]
  # ---- Outputs de base-stack.yaml y fargate-stack.yaml (los pasa deploy-ci.sh) ----
  EcrRepositoryName:
    Type: String
    Default: blacklist-service
  DBHost:
    Type: String
  DBSecretArn:
    Type: String
  TokenSecretArn:
    Type: String
  JwtSecretArn:
    Type: String
  TaskExecutionRoleArn:
    Type: String
  TaskRoleArn:
    Type: String
  CodeDeployApplicationName:
    Type: String
    Default: blacklist-service-cd
  DeploymentGroupName:
    Type: String
    Default: blacklist-service-dg

Conditions:
  CreateConnection: !Equals [!Ref ExistingConnectionArn, ""]

Resources:
  # --------------------------------------------------------------------------
  # Conexion GitHub (solo si no se pasa una existente). Queda PENDING:
  # CloudFormation no puede completar el handshake OAuth con GitHub.
  # --------------------------------------------------------------------------
  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Condition: CreateConnection
    Properties:
      ConnectionName: !Sub "gh-${GitHubOwner}"
      ProviderType: GitHub

  # --------------------------------------------------------------------------
  # Bucket de artefactos (lo usa el pipeline como artifact store).
  # --------------------------------------------------------------------------
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # --------------------------------------------------------------------------
  # Logs y reportes de CodeBuild gestionados por el stack, para que se borren
  # con el. Si CodeBuild los creara solo, quedarian huerfanos al borrar.
  # --------------------------------------------------------------------------
  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${ProjectName}"
      RetentionInDays: !Ref LogRetentionDays

  # Nombre = <proyecto>-<clave de 'reports' en buildspec.yml> ("pytest-reports").
  TestReportGroup:
    Type: AWS::CodeBuild::ReportGroup
    Properties:
      Name: !Sub "${ProjectName}-pytest-reports"
      Type: TEST
      DeleteReports: true
      ExportConfig:
        ExportConfigType: NO_EXPORT

  # --------------------------------------------------------------------------
  # IAM: minimo privilegio, cada rol limitado a sus recursos.
  # --------------------------------------------------------------------------
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: codebuild-ci
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt BuildLogGroup.Arn
                  - !Sub "${BuildLogGroup.Arn}:*"
              - Sid: Artifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Sid: ArtifactBucketMeta
                Effect: Allow
                Action:
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                Resource: !GetAtt ArtifactBucket.Arn
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}"
              - Sid: TestReports
                Effect: Allow
                Action:
                  - codebuild:CreateReportGroup
                  - codebuild:CreateReport
                  - codebuild:UpdateReport
                  - codebuild:BatchPutTestCases
                  - codebuild:BatchPutCodeCoverages
                Resource: !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/${ProjectName}-*"

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: codepipeline-ci
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ArtifactStore
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Sid: ArtifactStoreMeta
                Effect: Allow
                Action:
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt ArtifactBucket.Arn
              - Sid: RunCodeBuild
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt CodeBuildProject.Arn
              - Sid: UseGitHubConnection
                Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                  - codeconnections:UseConnection
                Resource: !If
                  - CreateConnection
                  - !GetAtt GitHubConnection.ConnectionArn
                  - !Ref ExistingConnectionArn
              # Etapa Deploy: CodeDeployToECS registra la task definition y crea el despliegue
              - Sid: CodeDeployToEcs
                Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:RegisterApplicationRevision
                Resource: "*"
              - Sid: EcsTaskDefinition
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeServices
                  - ecs:TagResource
                Resource: "*"
              - Sid: PassTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Ref TaskExecutionRoleArn
                  - !Ref TaskRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  # --------------------------------------------------------------------------
  # CodeBuild: la fuente y la salida las maneja el pipeline.
  # --------------------------------------------------------------------------
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    DependsOn: TestReportGroup
    Properties:
      Name: !Ref ProjectName
      Description: Corre pytest, construye la imagen del contenedor y la sube a ECR.
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        # Necesario para ejecutar docker build dentro de CodeBuild
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: ECR_REPOSITORY_URI
            Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepositoryName}"
          # Datos del ambiente que buildspec.yml escribe en taskdef.json
          - Name: DB_HOST
            Value: !Ref DBHost
          - Name: DB_SECRET_ARN
            Value: !Ref DBSecretArn
          - Name: TOKEN_SECRET_ARN
            Value: !Ref TokenSecretArn
          - Name: JWT_SECRET_ARN
            Value: !Ref JwtSecretArn
          - Name: TASK_EXECUTION_ROLE_ARN
            Value: !Ref TaskExecutionRoleArn
          - Name: TASK_ROLE_ARN
            Value: !Ref TaskRoleArn
      TimeoutInMinutes: 15
      QueuedTimeoutInMinutes: 30
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup

  # --------------------------------------------------------------------------
  # Pipeline V2: Source (GitHub) -> Build (CodeBuild) -> Deploy (CodeDeploy a ECS Fargate).
  # El trigger filtra push a la rama indicada: cada commit a master recorre las 3 etapas.
  # Si Build falla (pruebas o docker build), Deploy no se ejecuta.
  # --------------------------------------------------------------------------
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Ref PipelineName
      PipelineType: V2
      ExecutionMode: QUEUED
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              RunOrder: 1
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !If
                  - CreateConnection
                  - !GetAtt GitHubConnection.ConnectionArn
                  - !Ref ExistingConnectionArn
                FullRepositoryId: !Sub "${GitHubOwner}/${GitHubRepo}"
                BranchName: !Ref BranchName
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceArtifact
        - Name: Build
          Actions:
            - Name: BuildAndTest
              RunOrder: 1
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref CodeBuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
        - Name: Deploy
          Actions:
            - Name: DeployToFargate
              RunOrder: 1
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: "1"
              Configuration:
                ApplicationName: !Ref CodeDeployApplicationName
                DeploymentGroupName: !Ref DeploymentGroupName
                TaskDefinitionTemplateArtifact: BuildArtifact
                TaskDefinitionTemplatePath: taskdef.json
                AppSpecTemplateArtifact: BuildArtifact
                AppSpecTemplatePath: appspec.yaml
                Image1ArtifactName: BuildArtifact
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: BuildArtifact
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: Source
            Push:
              - Branches:
                  Includes:
                    - !Ref BranchName

Outputs:
  ConnectionArn:
    Description: Si el stack la creo, autorizala en Developer Tools > Settings > Connections (Update pending connection).
    Value: !If
      - CreateConnection
      - !GetAtt GitHubConnection.ConnectionArn
      - !Ref ExistingConnectionArn
  ArtifactBucketName:
    Description: Bucket de artefactos. Vacialo antes de borrar el stack (destroy.sh lo hace).
    Value: !Ref ArtifactBucket
  CodeBuildProjectName:
    Value: !Ref CodeBuildProject
  PipelineName:
    Value: !Ref Pipeline
  PipelineConsoleUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view?region=${AWS::Region}"
