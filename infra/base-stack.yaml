AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Entrega 3 DevOps (base): repositorio ECR, PostgreSQL en RDS y secretos de la app.
  Es lo que necesita existir ANTES de crear el servicio en Fargate (fargate-stack.yaml).

Parameters:
  ProjectName:
    Type: String
    Default: blacklist-service
    AllowedPattern: "[a-z0-9-]{3,24}"
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subredes en al menos 2 AZ (RDS lo exige).
  StaticBearerToken:
    Type: String
    NoEcho: true
    MinLength: 16
  JwtSecretKey:
    Type: String
    NoEcho: true
    MinLength: 16
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
  DBEngineVersion:
    Type: String
    Default: "16"

Resources:
  # ------------------------------ ECR ------------------------------
  # CodeBuild sube aqui una imagen por commit (tag = 8 primeros caracteres del hash).
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref ProjectName
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Conservar las ultimas 15 imagenes",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":15},
            "action":{"type":"expire"}}]}

  # ---------------------------- Secretos ----------------------------
  # La task definition los inyecta como variables de entorno (no quedan en texto plano).
  TokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: STATIC_BEARER_TOKEN de blacklist-service
      SecretString: !Ref StaticBearerToken

  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: JWT_SECRET_KEY de blacklist-service
      SecretString: !Ref JwtSecretKey

  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Credenciales PostgreSQL de blacklist-service
      GenerateSecretString:
        SecretStringTemplate: '{"username": "blacklist_admin"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true

  # ------------------------------ RDS ------------------------------
  # Sin reglas de entrada: fargate-stack.yaml agrega la regla desde las tareas.
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL de blacklist-service (solo desde las tareas Fargate)
      VpcId: !Ref VpcId

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subredes de blacklist-service
      SubnetIds: !Ref SubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    # Proyecto academico: se borra sin snapshot para quedar en costo cero.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: postgres
      EngineVersion: !Ref DBEngineVersion
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: blacklist
      MasterUsername: !Sub "{{resolve:secretsmanager:${DBSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DBSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 0
      DeletionProtection: false

Outputs:
  RepositoryName:
    Value: !Ref Repository
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  DBHost:
    Value: !GetAtt Database.Endpoint.Address
  DBSecretArn:
    Value: !Ref DBSecret
  TokenSecretArn:
    Value: !Ref TokenSecret
  JwtSecretArn:
    Value: !Ref JwtSecret
  DBSecurityGroupId:
    Value: !GetAtt DBSecurityGroup.GroupId
