# buildspec.yml
# -------------
# Guion que AWS CodeBuild ejecuta en CADA build (Entrega 3 - CI + CD).
# El proyecto lo crea infra/ci-pipeline.yaml, que define las variables de entorno:
#   AWS_ACCOUNT_ID, ECR_REPOSITORY_URI, DB_HOST, DB_SECRET_ARN, TOKEN_SECRET_ARN,
#   JWT_SECRET_ARN, TASK_EXECUTION_ROLE_ARN, TASK_ROLE_ARN
#
#   install     -> Python 3.12 (imagen Amazon Linux 2023 standard:5.0).
#   pre_build   -> dependencias + pruebas unitarias (pytest) + login a ECR.
#                  Si pytest falla, la fase falla y NO se construye ni se sube imagen.
#   build       -> docker build de la imagen (tag = 8 primeros caracteres del commit).
#   post_build  -> SOLO si todo fue bien: push a ECR, imageDetail.json y taskdef.json
#                  con los datos del ambiente. Son los insumos de la etapa Deploy.
#   reports     -> resultado de pytest (JUnit XML) en la pestana "Reports" de CodeBuild.
#   artifacts   -> imageDetail.json + taskdef.json + appspec.yaml para CodeDeploy.

version: 0.2

env:
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "== INSTALL =="
      - python --version

  pre_build:
    commands:
      - 'echo "== PRE_BUILD: dependencias y pruebas unitarias =="'
      - pip install -r requirements-dev.txt
      - mkdir -p reports
      - python -m pytest -v --junitxml=reports/junit.xml
      - 'echo "== PRE_BUILD: login a ECR =="'
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - IMAGE_TAG=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-8)

  build:
    commands:
      - 'echo "== BUILD: imagen del contenedor =="'
      - docker build -t "${ECR_REPOSITORY_URI}:${IMAGE_TAG}" .

  post_build:
    commands:
      # post_build corre aunque una fase anterior falle: solo publicamos si todo fue bien.
      - 'echo "== POST_BUILD: CODEBUILD_BUILD_SUCCEEDING=$CODEBUILD_BUILD_SUCCEEDING =="'
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then
          docker push "${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          printf '{"ImageURI":"%s"}' "${ECR_REPOSITORY_URI}:${IMAGE_TAG}" > imageDetail.json
          sed -i \
            -e "s|<TASK_EXECUTION_ROLE_ARN>|${TASK_EXECUTION_ROLE_ARN}|g" \
            -e "s|<TASK_ROLE_ARN>|${TASK_ROLE_ARN}|g" \
            -e "s|<REGION>|${AWS_DEFAULT_REGION}|g" \
            -e "s|<DB_HOST>|${DB_HOST}|g" \
            -e "s|<DB_SECRET_ARN>|${DB_SECRET_ARN}|g" \
            -e "s|<TOKEN_SECRET_ARN>|${TOKEN_SECRET_ARN}|g" \
            -e "s|<JWT_SECRET_ARN>|${JWT_SECRET_ARN}|g" \
            taskdef.json
          echo "Imagen publicada: ${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
        else
          echo "Build fallido: no se publica imagen ni artefactos."
        fi

reports:
  pytest-reports:
    base-directory: reports
    files:
      - junit.xml
    file-format: JUNITXML

artifacts:
  files:
    - imageDetail.json
    - taskdef.json
    - appspec.yaml
