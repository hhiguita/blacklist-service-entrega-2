# buildspec.yml
# -------------
# Guion que AWS CodeBuild ejecuta en CADA build (Entrega 2 - Integracion Continua).
#
#   install     -> fija Python 3.12 (imagen Amazon Linux 2023 standard:5.0).
#   pre_build   -> instala dependencias de la app + pytest.
#   build       -> corre las pruebas. Si fallan, pytest sale con codigo != 0 y
#                  el build queda FAILED (y la accion del pipeline en rojo).
#   post_build  -> deja constancia del resultado. OJO: segun la doc de AWS
#                  (Build phase transitions) post_build se ejecuta aunque build
#                  falle, y UPLOAD_ARTIFACTS "siempre se intenta". Por eso aqui
#                  no se empaqueta nada a mano.
#   reports     -> publica el resultado de pytest (JUnit XML) en la pestana
#                  "Reports" de CodeBuild: evidencia visual para el documento.
#   artifacts   -> SOLO el codigo desplegable (sin tests, sin buildspec).
#
# Alcance Entrega 2: SOLO genera el artefacto (CI). NO despliega (eso es CD).

version: 0.2

env:
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "== INSTALL =="
      - python --version

  pre_build:
    commands:
      - echo "== PRE_BUILD: instalando dependencias =="
      - pip install -r requirements.txt
      - pip install pytest==8.3.3        # solo para CI, no va en requirements.txt

  build:
    commands:
      - echo "== BUILD: pruebas unitarias =="
      - mkdir -p reports
      - python -m pytest -v --junitxml=reports/junit.xml

  post_build:
    commands:
      # CODEBUILD_BUILD_SUCCEEDING = 1 si todo va bien, 0 si una fase fallo.
      - echo "== POST_BUILD: CODEBUILD_BUILD_SUCCEEDING=$CODEBUILD_BUILD_SUCCEEDING =="
      - echo "Commit fuente = $CODEBUILD_RESOLVED_SOURCE_VERSION"

reports:
  pytest-reports:
    base-directory: reports
    files:
      - junit.xml
    file-format: JUNITXML

# Artefacto desplegable: lista BLANCA de lo que Beanstalk necesita.
artifacts:
  files:
    - application.py
    - config.py
    - models.py
    - schemas.py
    - resources.py
    - requirements.txt
    - .ebextensions/**/*
