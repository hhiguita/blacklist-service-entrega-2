# buildspec.yml
# -------------
# Guion que AWS CodeBuild ejecuta en CADA build (Entrega 2 - Integracion Continua).
# El proyecto lo crea infra/ci-pipeline.yaml, que define ARTIFACT_BUCKET.
#
#   install     -> Python 3.12 (imagen Amazon Linux 2023 standard:5.0).
#   pre_build   -> dependencias de la app + pytest (requirements-dev.txt).
#   build       -> 1) pruebas  2) zip desplegable  3) copia a S3 con el hash del commit.
#                  Si pytest falla, la fase BUILD falla y los comandos siguientes de la
#                  fase no se ejecutan: no se genera ni se copia app.zip.
#   post_build  -> deja constancia del resultado. Segun la doc de AWS (Build phase
#                  transitions) post_build corre aunque build falle y UPLOAD_ARTIFACTS
#                  "siempre se intenta"; en un build fallido no hay app.zip que subir.
#   reports     -> resultado de pytest (JUnit XML) en la pestana "Reports" de CodeBuild.
#   artifacts   -> app.zip, salida que CodePipeline guarda en su bucket.
#
# Alcance Entrega 2: SOLO genera el artefacto (CI). NO despliega (eso es CD).

version: 0.2

env:
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "== INSTALL =="
      - python --version

  pre_build:
    commands:
      - echo "== PRE_BUILD: instalando dependencias =="
      - pip install -r requirements-dev.txt

  build:
    commands:
      - echo "== BUILD: pruebas unitarias =="
      - mkdir -p reports
      - python -m pytest -v --junitxml=reports/junit.xml
      - echo "== BUILD: empaquetando artefacto desplegable =="
      - zip -r app.zip application.py config.py models.py schemas.py resources.py requirements.txt .ebextensions
      - unzip -l app.zip
      - aws s3 cp app.zip "s3://${ARTIFACT_BUCKET}/builds/app-${CODEBUILD_RESOLVED_SOURCE_VERSION}.zip"

  post_build:
    commands:
      # CODEBUILD_BUILD_SUCCEEDING = 1 si todo va bien, 0 si una fase fallo.
      - echo "== POST_BUILD: CODEBUILD_BUILD_SUCCEEDING=$CODEBUILD_BUILD_SUCCEEDING =="
      - echo "Commit fuente = $CODEBUILD_RESOLVED_SOURCE_VERSION"

reports:
  pytest-reports:
    base-directory: reports
    files:
      - junit.xml
    file-format: JUNITXML

artifacts:
  files:
    - app.zip
